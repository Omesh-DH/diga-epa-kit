name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            spec/packages
            ~/.fhir/packages
          key: fhir-${{ hashFiles('spec/packages.lock.json', 'scripts/validate.py') }}
      - run: pip install -e .
      - run: python scripts/fetch_spec.py
      - name: Gate (golden bundles, zero errors)
        run: python scripts/validate.py --report out/validation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: out/
