name: pages

# Publishes the try-it page (site/) on GitHub Pages. Pages needs a public
# repository on GitHub's free plan, so the job is skipped while it is private.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pack the kit and the examples for the page
        # Empty unless the repository variable GOATCOUNTER_URL is set; then the page counts
        # anonymously whether it worked (see README, "Usage counting").
        env:
          DIGA_SITE_COUNTER: ${{ vars.GOATCOUNTER_URL }}
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
