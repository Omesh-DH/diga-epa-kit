[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diga-epa-kit"
version = "0.1.0"
description = "Open-source kit turning DiGA data into KBV MIO DiGA FHIR bundles for the ePA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pip-licenses>=5"]

[project.scripts]
diga-epa-kit = "diga_epa_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diga_epa_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not validator\""
markers = ["validator: runs the external Java FHIR validator (slow, needs Java)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
