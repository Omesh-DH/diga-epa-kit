# Local hooks only: they run the tools from the project's own environment
# (pip install -e ".[dev]"), so nothing is downloaded at commit time.
# Never run on this machine yet (docs/STATUS.md).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy (src)
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (unit and golden, includes the wording guard)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
